[tool.poetry]
name = "robot"
version = "0.1.0"
description = ""
authors = ["Connor <connor@trilo.bio>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"

[tool.poetry.group.revup]
optional = true

[tool.poetry.group.revup.dependencies]
revup = "^0.3.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^23.1.0"
flake8 = "^6.0.0"
ipdb = "^0.13.11"
isort = "^5.12.0"
mypy = "^1.4.0"
pylint = "^2.16.2"
ruff = "^0.1.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120 # longer than black (100) to only catch the worst of the errors

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
