[project]
name = "aceta"
version = "0.1.0"
description = "Aceta"
authors = []
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.8.2",
    "ipython>=9.1.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
    "ptpython>=3.0.30",
    "ruff>=0.11.5",
    "snakeviz>=2.2.2",
    "types-protobuf>=5.29.1.20250403",
    "types-toml>=0.10.8.20240310",
    "types-requests>=2.32.0.20250602",
]


[tool.uv.workspace]
members = [
    "core",
    "can_bus",
    "can-relay",
    "config-tools",
    "firmware-tools",
    "log-tools",
    "robot",
    "scale",
    "tcode",
    "test-fixture",
    "path_planner",
    "registry"
]

[tool.uv.sources]
# tcode-api = { path = "../tcode-api" }
tcode-api = { git = "ssh://git@github.com/trilobio/tcode-api.git", rev = "v1.18.0" }
transform-tree = { git = "ssh://git@github.com/trilobio/transform-tree.git", rev = "v2.7.0" }
aceta-grpc = { git = "ssh://git@github.com/trilobio/grpc.git", rev = "v1.3.1" }
stm32-fdcan-loader = { git = "ssh://git@github.com/trilobio/stm32-fdcan-loader.git", rev = "v0.1.2"}

can-relay = { workspace = true }
can-bus = { workspace = true }
config-tools = { workspace = true }
core = { workspace = true }
log-tools = { workspace = true }
path-planner = { workspace = true }
robot = { workspace = true }
scale = { workspace = true }
firmware-tools = { workspace = true }
registry = { workspace = true }

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
# https://adamj.eu/tech/2021/05/25/python-type-hints-specific-type-ignore/
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
