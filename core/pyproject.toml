[tool.poetry]
name = "core"
version = "0.1.0"
description = "Generic structures for writing Python at Trilobio."
authors = ["Connor Novak <connor@trilo.bio>"]
readme = "README.md"

[tool.poetry.scripts]
test = "tests:main"

[tool.poetry.dependencies]
python = "^3.11"
typing-extensions = "^4.12.2"
plac = "^1.4.3"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
mypy = "^1.11.1"
ruff = "^0.1.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
