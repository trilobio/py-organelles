[project]
name = "log-tools"
version = "0.1.0"
description = "Various python logging tools for internal Trilobio use."
authors = []
readme = "README.md"
packages = [{include = "log_tools"}]
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = [
    "plac>=1.4.5",
    "python-json-logger>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry.scripts]
test = "tests:main"

[dependency-groups]
dev = []
