[tool.poetry]
name = "log-tools"
version = "0.1.0"
description = "Various python logging tools for internal Trilobio use."
authors = ["Your Name <you@example.com>"]
license = "n"
readme = "README.md"
packages = [{include = "log_tools"}]

[tool.poetry.dependencies]
python = "^3.11"
python-json-logger = "^2.0.7"
plac = "^1.4.3"
typing-extensions = "^4.12.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.scripts]
test = "tests:main"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
mypy = "^1.11.1"
ruff = "^0.1.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
